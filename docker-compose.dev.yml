services:
  nginx:
    image: nginx:1.29
    ports: 
      - 8080:80
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    container_name: bloglist-proxy
    depends_on:
      - app
      - server
  
  app:
    image: bloglist-frontend-dev
    build:
      context: ./client
      dockerfile: dev.Dockerfile
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - server
    
  server:
    image: bloglist-backend-dev
    build:
      context: ./server
      dockerfile: dev.Dockerfile
    volumes:
      - ./server:/user/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./server/.env
