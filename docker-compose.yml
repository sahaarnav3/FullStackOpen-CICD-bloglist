services:
  nginx:
    image: nginx:1.29
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - server

  app:
    image: bloglist-frontend-prod
    build:
      context: ./client
      dockerfile: Dockerfile

  server:
    image: bloglist-backend-prod
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
