# fly.toml app configuration file generated for fullstackopen-cicd-bloglist on 2026-10-08T21:00:28+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fullstackopen-cicd-bloglist'
primary_region = 'sin'

[build]

[env]
  PORT = "3001"

[processes]
  app = "npm run start"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[deploy]
  strategy = "canary"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
